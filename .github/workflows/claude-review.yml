name: 'Claude PR Review (Bedrock)'

# Claude Code reviews PRs using Claude on Amazon Bedrock (burns AWS credits;
# no per-day cap like the Gemini free tier). Auth is AWS OIDC — GitHub mints a
# short-lived token and assumes an IAM role; no long-lived AWS keys.
#
# DORMANT until you flip it on: the job is gated on the repo Variable
# ENABLE_CLAUDE_REVIEW == 'true', so adding this file won't fire (or fail) a
# review before the AWS side exists. To activate:
#   1. Widen the gha-claude-reviewer IAM role trust policy to also allow
#      repo:cycle-five/runecast-protocol:* (the role/OIDC provider/Bedrock
#      perms from the anya setup are reused — only the trust scope changes).
#   2. Install the cycle-five-review-bot GitHub App on this repo.
#   3. Add repo Secrets  AWS_ROLE_TO_ASSUME, APP_ID, APP_PRIVATE_KEY.
#   4. Add repo Variable ENABLE_CLAUDE_REVIEW = true.
# Adjust AWS_REGION / the --model id below to a Bedrock model you've enabled.
#
# ── Why this is safe here, on the one PUBLIC repo ───────────────────────────
# The bot runs only on the private repos elsewhere, deliberately. Protocol is
# public, so the exposure question is real and the answer is that this workflow
# was already written for it:
#   * it triggers on `pull_request`, NOT `pull_request_target` — the latter is
#     the trigger that runs untrusted fork code WITH secrets in scope;
#   * it additionally skips fork PRs outright (`head.repo.fork == false`), and
#     GitHub already withholds secrets from fork-triggered `pull_request` runs,
#     so the guard is doubled;
#   * it runs on ubuntu-latest, never a self-hosted runner, so there is no
#     persistent-runner compromise path.
# Net effect: PRs from branches in this repo get reviewed; fork PRs silently
# skip the job. Note APP_PRIVATE_KEY can mint tokens for every repo the App is
# installed on, so its blast radius is cross-repo — it is unreachable from
# forks, but treat it accordingly.
#
# It is worth having HERE most of all: this crate is the wire contract both the
# backend and the frontend compile against, and a mistake becomes expensive the
# moment it ships in a tag.

on:
  pull_request:
    types:
      - 'opened'
      - 'synchronize'

permissions:
  contents: 'read'
  pull-requests: 'write'
  id-token: 'write' # required for AWS OIDC

jobs:
  review:
    # Stays dormant until the AWS side is wired up and this Variable is set.
    if: |-
      ${{ vars.ENABLE_CLAUDE_REVIEW == 'true' && github.event.pull_request.head.repo.fork == false }}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0

      - name: 'Configure AWS credentials (OIDC)'
        uses: 'aws-actions/configure-aws-credentials@v4'
        with:
          role-to-assume: '${{ secrets.AWS_ROLE_TO_ASSUME }}'
          aws-region: 'us-west-2' # adjust to a region where you've enabled Claude on Bedrock

      # Post reviews as our own GitHub App (cycle-five-review-bot) instead of the
      # default claude[bot] identity. Requires repo Secrets APP_ID + APP_PRIVATE_KEY.
      - name: 'Mint GitHub App token'
        id: 'app_token'
        uses: 'actions/create-github-app-token@v2'
        with:
          app-id: '${{ secrets.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'

      - name: 'Claude review'
        uses: 'anthropics/claude-code-action@v1'
        with:
          github_token: '${{ steps.app_token.outputs.token }}'
          use_bedrock: 'true'
          # Claude must be given the comment-posting tools explicitly, and told
          # to use them — otherwise the review just lands in the (hidden) logs.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out.
            Be concise and skip nitpicks that don't matter.

            This crate is the WIRE CONTRACT between runecast-backend and
            runecast-frontend. Once a change ships in a signed tag both consume,
            reversing it is expensive — so weight the review accordingly and
            look hardest at:

            * Backward compatibility. New enum variants must be additive and
              must NOT displace a `#[serde(other)]` fallback arm from last
              position, or older clients stop degrading and start failing.
              New struct fields on existing types should be
              `Option` + `#[serde(default, skip_serializing_if)]` so untouched
              modes serialize byte-identically.
            * Snowflake ids. Every i64 id must ride the wire as a STRING
              (`#[serde_as(as = "serde_with::DisplayFromStr")]`). An unquoted
              number silently corrupts above 2^53 in JavaScript.
            * Typed serde only — no `serde_json::json!` or `serde_json::Value`
              for data we own. See AI_CODING_STANDARDS.md.
            * Information leaks. Messages broadcast to other players must not
              carry data the recipient should not know.
            * Public items documented; `cargo doc` warning-free.

            Use `gh pr comment` for top-level feedback (a short summary verdict).
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) to flag specific lines.
            Only post GitHub comments — don't submit review text as messages.
          claude_args: |
            --model ${{ vars.BEDROCK_MODEL_ID || 'us.anthropic.claude-sonnet-4-5-20250929-v1:0' }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
